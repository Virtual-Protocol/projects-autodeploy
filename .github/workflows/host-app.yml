# Sets up a new app so it can deploy. The "Host an app" form in the bizops
# portal starts this; platform engineers can also run it from the Actions tab.
# Running it again for an app that's already hosted only re-checks its settings.
name: Host an app
# The request id, when given, makes each run's title unique, so the portal can
# find exactly the run it started.
run-name: Host ${{ inputs.repo }} for ${{ inputs.requested_by }}${{ inputs.request_id && format(' [{0}]', inputs.request_id) || '' }}

on:
  workflow_dispatch:
    inputs:
      repo:
        description: Repository in Virtual-Protocol (name only, e.g. internal-bizops-tool)
        required: true
      requested_by:
        description: Email of the person asking. Must match owner in the app's platform.yaml
        required: true
      data_class:
        description: What the app holds
        type: choice
        options: [none, internal, personal]
        default: internal
      request_id:
        description: Set by the bizops portal to find this run again. Leave empty when running by hand
        required: false
        default: ""

concurrency:
  group: host-app-${{ inputs.repo }}
  cancel-in-progress: false

env:
  PROJECT_ID: virtuals-internal-apps
  PROJECT_NUMBER: "912665393140"
  REGION: asia-southeast1
  REGISTRY: asia-southeast1-docker.pkg.dev/virtuals-internal-apps/apps
  DOMAIN: virtuals.io
  WIF_PROVIDER: projects/912665393140/locations/global/workloadIdentityPools/github/providers/autodeploy
  PROVISIONER_SA: autodeploy-provisioner@virtuals-internal-apps.iam.gserviceaccount.com
  DEPLOYER_SA: autodeploy-deployer@virtuals-internal-apps.iam.gserviceaccount.com

jobs:
  host:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      # Inputs come from a form, so they are only ever passed as environment
      # variables and are validated before anything uses them.
      - name: Check the request
        env:
          REPO: ${{ inputs.repo }}
          REQUESTED_BY: ${{ inputs.requested_by }}
          GH_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
        run: scripts/check-request.sh

      - uses: actions/checkout@v7
        with:
          repository: Virtual-Protocol/${{ inputs.repo }}
          token: ${{ secrets.ORG_READ_TOKEN }}
          path: app
          persist-credentials: false

      - name: Check the app follows the platform rules
        uses: ./actions/check
        with:
          path: app

      - name: Check platform.yaml against the request
        id: app
        env:
          REPO: ${{ inputs.repo }}
          REQUESTED_BY: ${{ inputs.requested_by }}
        run: scripts/read-platform.sh app

      # The page the app shows until its first deploy, built from this repo
      # before any cloud credentials exist on this runner.
      - name: Build the placeholder page
        env:
          IMAGE: ${{ env.REGISTRY }}/platform/placeholder:${{ github.sha }}
        run: docker build -t "$IMAGE" placeholder

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.PROVISIONER_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      # If this fails, the app shows Google's sample page instead.
      - name: Push the placeholder page
        id: placeholder
        continue-on-error: true
        env:
          IMAGE: ${{ env.REGISTRY }}/platform/placeholder:${{ github.sha }}
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Set up the app on Google Cloud
        env:
          NAME: ${{ steps.app.outputs.name }}
          STORAGE: ${{ steps.app.outputs.storage }}
          PUBLIC: ${{ steps.app.outputs.public }}
          SECRETS: ${{ steps.app.outputs.secrets }}
          VARIABLES: ${{ steps.app.outputs.variables }}
          PLACEHOLDER_IMAGE: ${{ steps.placeholder.outputs.image }}
          REPO: ${{ inputs.repo }}
          REQUESTED_BY: ${{ inputs.requested_by }}
          DATA_CLASS: ${{ inputs.data_class }}
        run: scripts/provision.sh
